<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>今日のピックアップ - BrieflyAI</title>
    <meta name="description" content="あなたにパーソナライズされた厳選ニュースを、AIがお届けします。">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700;900&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "charcoal": "#1a1a1a",
                        "charcoal-muted": "#666666",
                        "border-light": "#e5e5e5",
                    },
                    fontFamily: {
                        "display": ["Noto Serif JP", "serif"],
                        "sans": ["Noto Sans JP", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: "Noto Sans JP", sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        .serif-font {
            font-family: "Noto Serif JP", serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .card-img {
            aspect-ratio: 4 / 3;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Gradient variations - assigned dynamically via JS */
        .card-grad-0 {
            background: linear-gradient(135deg, #E91E63, #F06292, #CE93D8);
        }

        .card-grad-1 {
            background: linear-gradient(150deg, #1a1a1a, #333, #1a1a1a);
        }

        .card-grad-2 {
            background: linear-gradient(120deg, #00BCD4, #26C6DA, #80DEEA);
        }

        .card-grad-3 {
            background: linear-gradient(135deg, #FF5722, #FF8A65, #FFAB91);
        }

        .card-grad-4 {
            background: linear-gradient(160deg, #7B1FA2, #AB47BC, #E1BEE7);
        }

        .card-grad-5 {
            background: linear-gradient(135deg, #2196F3, #64B5F6, #BBDEFB);
        }

        .card-grad-6 {
            background: linear-gradient(145deg, #4CAF50, #81C784, #C8E6C9);
        }

        .card-grad-7 {
            background: linear-gradient(135deg, #FF9800, #FFB74D, #FFE0B2);
        }

        .card-grad-8 {
            background: linear-gradient(120deg, #607D8B, #90A4AE, #CFD8DC);
        }

        .card-grad-9 {
            background: linear-gradient(135deg, #F44336, #E57373, #FFCDD2);
        }

        .card-grad-10 {
            background: linear-gradient(155deg, #009688, #4DB6AC, #B2DFDB);
        }

        .card-grad-11 {
            background: linear-gradient(135deg, #3F51B5, #7986CB, #C5CAE9);
        }

        .article-card {
            transition: opacity 0.3s ease;
        }

        .article-card:hover h3 {
            text-decoration: underline;
            text-underline-offset: 3px;
        }
    </style>
</head>

<body class="min-h-screen">
    <div class="flex flex-col min-h-screen">
        <!-- Header -->
        <header class="border-b border-border-light bg-white sticky top-0 z-50">
            <div class="max-w-[1200px] mx-auto px-6 md:px-10 py-4 flex items-center justify-between">
                <div class="flex items-center gap-8">
                    <h2 class="text-charcoal text-xl font-black tracking-tight serif-font">BrieflyAI</h2>
                    <nav class="hidden md:flex items-center gap-6">
                        <a class="text-charcoal text-sm font-bold border-b-2 border-charcoal pb-0.5" href="#">ピックアップ</a>
                        <a class="text-charcoal-muted text-sm font-medium hover:text-charcoal transition-colors"
                            href="insights.html">インサイト</a>
                    </nav>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <button id="date-prev"
                            class="flex items-center justify-center size-7 rounded hover:bg-gray-100 transition-colors"
                            title="前日">
                            <span class="material-symbols-outlined text-lg text-charcoal-muted">chevron_left</span>
                        </button>
                        <span class="text-xs font-medium text-charcoal-muted tracking-wide"
                            id="current-date">読み込み中...</span>
                        <button id="date-next"
                            class="flex items-center justify-center size-7 rounded hover:bg-gray-100 transition-colors"
                            title="翌日">
                            <span class="material-symbols-outlined text-lg text-charcoal-muted">chevron_right</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1">
            <div class="max-w-[1200px] mx-auto px-6 md:px-10 py-10">
                <!-- Filter -->
                <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center gap-3">
                        <button id="filter-toggle"
                            class="flex items-center gap-1.5 text-sm text-charcoal-muted hover:text-charcoal transition-colors">
                            <span class="material-symbols-outlined text-lg">tune</span>
                            フィルター
                        </button>
                    </div>
                </div>
                <div id="filter-panel" class="hidden flex flex-wrap gap-2 mb-8">
                    <button
                        class="filter-chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-charcoal text-white border-charcoal"
                        data-filter-category="all">すべて</button>
                    <button
                        class="filter-chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-white text-charcoal-muted border-border-light hover:border-charcoal"
                        data-filter-category="AI・テクノロジー">テクノロジー</button>
                    <button
                        class="filter-chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-white text-charcoal-muted border-border-light hover:border-charcoal"
                        data-filter-category="経済・金融">経済</button>
                    <button
                        class="filter-chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-white text-charcoal-muted border-border-light hover:border-charcoal"
                        data-filter-category="政治・政策">政治</button>
                    <button
                        class="filter-chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-white text-charcoal-muted border-border-light hover:border-charcoal"
                        data-filter-category="科学">科学</button>
                </div>

                <!-- News articles grid -->
                <div id="news-articles-container"
                    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-10">
                    <!-- Loading state -->
                    <div class="col-span-full flex flex-col items-center justify-center py-20 gap-4">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-charcoal"></div>
                        <p class="text-charcoal-muted text-sm">ニュースを読み込み中...</p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="border-t border-border-light py-10 px-6 md:px-10">
            <div class="max-w-[1200px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2">
                    <span class="font-black text-sm serif-font text-charcoal">BrieflyAI</span>
                </div>
                <p class="text-xs text-charcoal-muted">© 2024 BrieflyAI</p>
            </div>
        </footer>
    </div>

    <script src="news-loader.js"></script>
</body>

</html>
